name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


concurrency:
  group: frontend-ci-cd-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:

  # ============================================================
  # CI
  # ============================================================

  frontend-ci:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Run lint if configured
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script configured. Skipping lint."
          fi


      - name: Run tests if configured
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "No test script configured. Skipping tests."
          fi


      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

        run: |
          npm run build


  # ============================================================
  # BUILD + PUSH DOCKER IMAGE
  #
  # Only happens on main after CI succeeds.
  # ============================================================

  docker-build:
    name: Build and push frontend image

    runs-on: ubuntu-latest

    needs:
      - frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:
          context: .
          push: true

          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # CD
  # ============================================================

  deploy:
    name: Deploy frontend to EC2

    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      # --------------------------------------------------------
      # Checkout because docker-compose.yml must be copied
      # to EC2.
      # --------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Verify EC2 + Docker
      # --------------------------------------------------------

      - name: Verify EC2 and Docker
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            '
              set -e

              echo "Connected to EC2."

              docker --version

              docker compose version
            '


      # --------------------------------------------------------
      # Frontend deployment directory
      # --------------------------------------------------------

      - name: Create deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p /home/$EC2_USER/taskflow-frontend"


      # --------------------------------------------------------
      # Copy Compose file
      # --------------------------------------------------------

      - name: Copy Docker Compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |
          scp \
            -i ~/.ssh/ec2_key \
            docker-compose.yml \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/taskflow-frontend/docker-compose.yml"


      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy frontend
        env:

          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

          IMAGE_TAG: ${{ github.sha }}

        run: |
          {
            printf 'export DOCKERHUB_USERNAME=%q\n' \
              "$DOCKERHUB_USERNAME"

            printf 'export DOCKERHUB_TOKEN=%q\n' \
              "$DOCKERHUB_TOKEN"

            printf 'export DOCKERHUB_REPOSITORY=%q\n' \
              "$DOCKERHUB_REPOSITORY"

            printf 'export IMAGE_TAG=%q\n' \
              "$IMAGE_TAG"


            cat <<'REMOTE_SCRIPT'

          set -euo pipefail


          echo "========================================="
          echo "Starting TaskFlow frontend deployment"
          echo "========================================="


          cd "$HOME/taskflow-frontend"


          # ====================================================
          # Exact Docker image for this Git commit
          # ====================================================

          export DOCKER_IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${IMAGE_TAG}"


          echo "Deploying image:"
          echo "$DOCKER_IMAGE"


          # ====================================================
          # Docker Hub authentication
          # ====================================================

          echo "Logging in to Docker Hub..."

          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin


          # ====================================================
          # Pull image
          # ====================================================

          echo "Pulling frontend image..."

          docker compose pull frontend


          # ====================================================
          # Start / recreate frontend
          # ====================================================

          echo ""
          echo "========================================="
          echo "Starting TaskFlow frontend"
          echo "========================================="

          docker compose up \
            -d \
            --force-recreate \
            frontend


          # ====================================================
          # Wait until healthy
          # ====================================================

          echo "Waiting for frontend to become healthy..."

          FRONTEND_ATTEMPTS=0

          until [ \
            "$(docker inspect \
              --format='{{.State.Health.Status}}' \
              taskflow-frontend 2>/dev/null || echo starting)" \
            = "healthy" \
          ]; do

            FRONTEND_ATTEMPTS=$((FRONTEND_ATTEMPTS + 1))

            if [ "$FRONTEND_ATTEMPTS" -ge 30 ]; then

              echo "ERROR: Frontend failed to become healthy."

              echo ""
              echo "Container status:"

              docker ps -a \
                --filter name=taskflow-frontend

              echo ""
              echo "Frontend logs:"

              docker logs \
                --tail 200 \
                taskflow-frontend || true

              exit 1
            fi


            echo "Frontend is still starting..."

            sleep 2

          done


          echo "Frontend is healthy."


          # ====================================================
          # Show status
          # ====================================================

          echo ""
          echo "========================================="
          echo "Frontend container"
          echo "========================================="

          docker compose ps


          # ====================================================
          # Show logs
          # ====================================================

          echo ""
          echo "========================================="
          echo "Latest frontend logs"
          echo "========================================="

          docker logs \
            --tail 50 \
            taskflow-frontend || true


          # ====================================================
          # Cleanup unused images
          # ====================================================

          echo "Cleaning unused Docker images..."

          docker image prune -f


          # ====================================================
          # Logout
          # ====================================================

          docker logout || true


          echo ""
          echo "========================================="
          echo "TaskFlow frontend deployment successful"
          echo "========================================="


          REMOTE_SCRIPT

          } | ssh \
              -i ~/.ssh/ec2_key \
              "$EC2_USER@$EC2_HOST" \
              'bash -s'


      # --------------------------------------------------------
      # Remove PEM from GitHub runner
      # --------------------------------------------------------

      - name: Cleanup SSH key
        if: always()

        run: |
          rm -f ~/.ssh/ec2_key