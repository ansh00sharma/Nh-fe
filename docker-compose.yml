services:
  frontend:
    image: ${DOCKER_IMAGE:-sharma999ansh/taskflow-frontend:latest}
    container_name: taskflow-frontend
    restart: unless-stopped

    ports:
      - "81:81"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
